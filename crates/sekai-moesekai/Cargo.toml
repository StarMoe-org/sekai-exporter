[package]
name = "sekai-moesekai"
description = "Asset forms of this game for the Moesekai site, and the storage view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sekai-convert.workspace = true
sekai-codec = { workspace = true, optional = true }
sekai-encode = { workspace = true, optional = true }
sekai-format = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
png = { version = "0.18.1", optional = true }

[features]
scenario = []
episode = ["scenario", "dep:sekai-format", "dep:serde", "dep:serde_json"]
virtual-live = ["scenario"]
costume = [
    "sekai-convert/model",
    "sekai-convert/animation",
    "dep:sekai-format",
    "dep:serde",
    "dep:serde_json",
]
storage-view = [
    "sekai-convert/image",
    "sekai-convert/audio",
    "sekai-convert/video",
    "sekai-encode/webp",
    "dep:sekai-codec",
    "dep:sekai-encode",
    "dep:sekai-format",
    "dep:png",
]

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
