[package]
name = "sekai-moesekai"
description = "Asset forms of this game for the Moesekai site, and the storage view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sekai-convert.workspace = true
sekai-game.workspace = true
sekai-codec = { workspace = true, optional = true }
sekai-encode = { workspace = true, optional = true }
sekai-format = { workspace = true, optional = true }
claxon = { version = "0.4.3", optional = true }
image-webp = { version = "0.2.4", optional = true }

[features]
scenario = []
episode = ["scenario", "sekai-convert/audio", "sekai-convert/image", "sekai-convert/live2d"]
virtual-live = ["scenario", "sekai-convert/timeline", "sekai-convert/audio"]
costume = ["sekai-convert/model"]
storage-view = [
    "sekai-convert/image",
    "sekai-convert/audio",
    "sekai-convert/video",
    "sekai-encode/mp3",
    "dep:sekai-codec",
    "dep:sekai-encode",
    "dep:sekai-format",
    "dep:claxon",
    "dep:image-webp",
]

[dev-dependencies]
png = "0.18.1"

[lints]
workspace = true
