[package]
name = "sekai-game"
description = "Game-specific inputs: deobfuscation, manifests, downloads, game data tables and region configuration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sekai-format.workspace = true
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "socks-proxy"], optional = true }
aes = { version = "0.9.4", optional = true }
cbc = { version = "0.2.1", optional = true }
rmp-serde = { version = "1.3.1", optional = true }

[features]
cdn = ["dep:serde", "dep:serde_json", "dep:ureq", "dep:aes", "dep:cbc", "dep:rmp-serde"]
client = []

[lints]
workspace = true
