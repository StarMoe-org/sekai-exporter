[package]
name = "sekai-publish"
description = "Layouts, stores and the publication protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sekai-catalog.workspace = true
sekai-format.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"], optional = true }

[features]
s3 = ["dep:ureq"]

[lints]
workspace = true

[[test]]
name = "s3"
required-features = ["s3"]
