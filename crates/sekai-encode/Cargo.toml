[package]
name = "sekai-encode"
description = "Encoders that write decoded content in standard formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
exr = { version = "1.74.3", default-features = false }
png = "0.18.1"
rusty_mp3 = "0.6.1"
sekai-codec.workspace = true
smallvec = "1"
libloading = { version = "0.9", optional = true }
webp = { version = "0.3", optional = true, default-features = false }

[features]
webp = ["dep:webp"]
aac = ["dep:libloading"]

[lints]
workspace = true

[dev-dependencies]
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
sha2 = "0.11.1"
