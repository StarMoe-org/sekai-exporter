[package]
name = "sekai-convert"
description = "The converter interface, writers and the general-purpose converters for Unity content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sekai-unity.workspace = true
sekai-codec.workspace = true
sekai-format.workspace = true
crc32fast = { version = "1.5.4", optional = true }
serde_json = { version = "1", optional = true }

[features]
image = ["sekai-codec/texture"]
audio = ["sekai-codec/cri"]
video = ["audio"]
model = ["image", "dep:crc32fast", "dep:serde_json"]
animation = []
live2d = ["image", "animation"]
ugui = ["image", "text"]
text = []
timeline = ["animation"]
particles = []

[lints]
workspace = true
