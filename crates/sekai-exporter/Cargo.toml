[package]
name = "sekai-exporter"
description = "Command-line program of the exporter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sekai-exporter"
path = "src/main.rs"

[[test]]
name = "serve"
required-features = ["serve"]

[dependencies]
sekai-unity.workspace = true
sekai-format.workspace = true
sekai-codec.workspace = true
sekai-catalog.workspace = true
sekai-game.workspace = true
sekai-convert.workspace = true
sekai-encode.workspace = true
sekai-publish.workspace = true
sekai-pipeline.workspace = true
sekai-moesekai.workspace = true
sekai-mysekai.workspace = true
sekai-layouts = { workspace = true, optional = true }
sha2 = "0.11.1"
lexopt = "0.3.2"
serde_json = "1"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
cpu-time = "1.0.0"
mimalloc = { version = "0.1", default-features = false }
sekai-serve = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }

[features]
image = ["sekai-convert/image"]
audio = ["sekai-convert/audio"]
video = ["sekai-convert/video"]
model = ["sekai-convert/model"]
animation = ["sekai-convert/animation"]
live2d = ["sekai-convert/live2d"]
ugui = ["sekai-convert/ugui"]
text = ["sekai-convert/text"]
timeline = ["sekai-convert/timeline"]
particles = ["sekai-convert/particles"]
scenario = ["sekai-moesekai/scenario"]
episode = ["sekai-moesekai/episode"]
virtual-live = ["sekai-moesekai/virtual-live"]
costume = ["sekai-moesekai/costume"]
storage-view = ["sekai-moesekai/storage-view"]
webp = ["sekai-encode/webp"]
cdn = ["sekai-game/cdn", "catalog-db"]
client = ["sekai-game/client", "dep:sekai-layouts"]
s3 = ["sekai-publish/s3"]
catalog-db = ["sekai-catalog/catalog-db"]
mysekai = ["sekai-mysekai/forms"]
serve = ["dep:sekai-serve", "dep:tokio", "dep:tokio-util", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:futures-util"]
default = ["cdn", "catalog-db", "image", "audio", "video", "model", "animation", "live2d", "text", "scenario", "episode", "virtual-live", "costume", "storage-view", "webp"]
preset-mysekai = ["default", "mysekai"]
preset-client = ["default", "client"]
full = ["default", "mysekai", "client", "s3", "serve"]

[lints]
workspace = true
