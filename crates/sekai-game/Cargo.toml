[package]
name = "sekai-game"
description = "Game-specific inputs: deobfuscation, manifests, downloads, game data tables and region configuration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sekai-format.workspace = true
sekai-unity = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls-no-provider", "socks"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
aes = { version = "0.9.4", optional = true }
cbc = { version = "0.2.1", optional = true }
rmp-serde = { version = "1.3.1", optional = true }
sha2 = { version = "0.11.1", optional = true }
base64 = { version = "0.23.1", optional = true }
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2"], optional = true }
# The deflate backend of `zip`. Features unify, so this is the backend of every user of flate2, and
# the canonical PNG bytes depend on it.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"], optional = true }

[features]
cdn = ["dep:serde", "dep:serde_json", "dep:reqwest", "dep:rustls", "dep:tokio", "dep:aes", "dep:cbc", "dep:rmp-serde", "dep:sha2", "dep:base64"]
client = ["dep:sekai-unity", "dep:zip", "dep:flate2"]

[lints]
workspace = true
