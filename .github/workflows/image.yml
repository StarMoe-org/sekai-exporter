name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/image.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the images of, such as v0.1.0"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  # The release tag a manual run builds; otherwise the ref that triggered the run.
  REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  # Each image is built natively on a runner of each platform and pushed by digest; `tags` then
  # names the digests of both platforms together.
  build:
    strategy:
      matrix:
        target: [serve, full]
        platform: [amd64, arm64]
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target == 'full' && 'full' || '' }}
          platforms: linux/${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
      - if: env.PUSH == 'true'
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.target }}-${{ matrix.platform }}"
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target }}-${{ matrix.platform }}
          path: digests/*
          retention-days: 1

  tags:
    if: github.event_name != 'pull_request'
    needs: build
    strategy:
      matrix:
        target: [serve, full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.target }}-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        id: name
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # The full image takes the tags of the serve image after `full-`, and `full` for `main`.
          case "${{ matrix.target }}" in
            full) prefix=full- latest=full ;;
            *) prefix= latest=main ;;
          esac
          sha=$(git rev-parse HEAD)
          tags="$image:$prefix${sha::12}"
          if [[ "$REF" == refs/tags/v* ]]; then
            version="${REF#refs/tags/v}"
            declared=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            if [[ "$version" != "$declared" ]]; then
              echo "::error::tag v$version does not match the workspace version $declared"
              exit 1
            fi
            tags="$tags,$image:$prefix$version"
            # A release (not a pre-release) also moves the tag of its minor version.
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              tags="$tags,$image:$prefix${version%.*}"
            fi
          else
            tags="$tags,$image:$latest"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Tag both platforms
        run: |
          image="${{ steps.name.outputs.image }}"
          sources=$(for digest in $(cat digests/*); do echo -n " $image@$digest"; done)
          args=$(echo "${{ steps.name.outputs.tags }}" | tr ',' '\n' | sed 's/^/--tag /' | tr '\n' ' ')
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            $args $sources
          docker buildx imagetools inspect "$(echo "${{ steps.name.outputs.tags }}" | cut -d, -f1)"
